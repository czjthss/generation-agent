<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间序列生成 Agent</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17242b;background:#edf2f4}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{padding:30px 22px;background:#18262d;color:#fff}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:750}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;background:#27a59e}aside p{margin-top:22px;color:#b8c7cc;font-size:13px;line-height:1.7}main{padding:34px clamp(20px,4vw,58px) 48px}h1{margin:0;font-size:30px;letter-spacing:0}.subtitle{margin:7px 0 24px;color:#68777e}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:20px;align-items:start}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:8px}.panel-head{padding:18px 20px;border-bottom:1px solid #e3e9ec;font-weight:700}.form,.status{padding:20px}.mode{display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:20px;border-radius:6px;background:#edf2f4}.mode input{position:absolute;width:1px;height:1px;opacity:0}.mode label{padding:10px;text-align:center;border-radius:4px;color:#53636b;font-weight:650;cursor:pointer}.mode input:checked+label{background:#fff;color:#146f7f;box-shadow:0 1px 4px #1420281f}.field{display:grid;gap:7px;min-width:0}.field>label{font-size:13px;font-weight:650;color:#405058}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #c9d5da;border-radius:5px;background:#fff;color:#17242b}textarea{min-height:92px;resize:vertical;line-height:1.55}.picker-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.secondary{padding:10px 12px;border:1px solid #b8c9cf;border-radius:5px;background:#f7fafb;color:#146f7f;font-weight:700;cursor:pointer;white-space:nowrap}.secondary:hover{background:#edf6f7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.full{grid-column:1/-1}.hidden{display:none!important}.actions{display:flex;justify-content:flex-end;margin-top:22px}.primary{padding:11px 20px;border:0;border-radius:5px;background:#146f7f;color:#fff;font-weight:700;cursor:pointer}.primary:hover{background:#0d5b69}.primary:disabled{opacity:.58;cursor:wait}.status{min-height:240px}.empty,.message{color:#6d7b82;line-height:1.7}.status-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.track{height:8px;margin:10px 0 18px;border-radius:4px;overflow:hidden;background:#e8eef0}.bar{height:100%;background:#27a59e;transition:width .3s}.error{padding:10px;border:1px solid #efc7c7;border-radius:5px;background:#fff0f0;color:#a12828;overflow-wrap:anywhere}.summary{display:grid;gap:9px;margin-bottom:16px}.summary div{display:flex;justify-content:space-between;gap:16px;padding-bottom:8px;border-bottom:1px solid #edf1f3}.summary dt{color:#718087}.summary dd{margin:0;text-align:right;overflow-wrap:anywhere}.chart-wrap{margin-bottom:16px;padding:10px;border:1px solid #dce4e7;border-radius:5px;background:#fbfcfd}.chart-wrap canvas{width:100%;height:220px;display:block}.chart-note{margin:8px 0 0;color:#718087;font-size:12px}.files{display:grid;gap:8px;max-height:300px;overflow:auto}.file{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid #dce4e7;border-radius:5px}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file a{color:#146f7f;font-weight:700;text-decoration:none}@media(max-width:940px){.shell{grid-template-columns:1fr}aside{padding:18px 22px}aside p{display:none}.layout{grid-template-columns:1fr}}@media(max-width:560px){main{padding:24px 14px 36px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.picker-row{grid-template-columns:1fr}h1{font-size:24px}.chart-wrap canvas{height:180px}}
  </style>
</head>
<body><div class="shell">
  <aside><div class="brand"><span class="mark">TS</span><span>Generation Agent</span></div><p>将自然语言中的领域知识编译为特征、语义约束和异常机制，并以紧凑 Arrow 分片保存。</p></aside>
  <main><h1>时间序列生成</h1><p class="subtitle">配置任务后，由多 Agent 工作流完成规划、合成、检查与抽样预览。</p>
    <div class="layout"><section class="panel"><div class="panel-head">生成参数</div>
      <form class="form" id="form">
        <div class="mode"><input type="radio" id="sequence" name="mode" value="sequence" checked><label for="sequence">单个 Arrow 序列</label><input type="radio" id="dataset" name="mode" value="dataset"><label for="dataset">多个 Arrow 数据集</label></div>
        <div class="field"><label for="description">数据描述或领域</label><textarea id="description" required placeholder="例如：生成中国南方夏季工业园区的电力负载"></textarea></div>
        <div class="grid">
          <div class="field full"><label for="output_dir">输出文件夹</label><div class="picker-row"><input id="output_dir" value="{{ default_output_dir }}" required><button type="button" class="secondary" id="pick_output">选择文件夹</button></div></div>
          <div class="field" id="filename_field"><label for="filename">Arrow 文件名</label><input id="filename" value="generated_timeseries.arrow"></div>
          <div class="field hidden" id="count_field"><label for="series_count">序列数量</label><input id="series_count" type="number" min="1" max="10000" value="10"></div>
          <div class="field hidden dataset-only"><label for="diversity_strength">多样性强度</label><select id="diversity_strength"><option value="medium">中</option><option value="low">低</option><option value="high">高</option><option value="off">关闭</option></select></div>
          <div class="field"><label for="length">每条序列长度</label><input id="length" type="number" min="1" max="1000000" value="168" required></div>
          <div class="field"><label for="freq">采样频率</label><select id="freq"><option value="h">每小时 h</option><option value="30min">每 30 分钟</option><option value="15min">每 15 分钟</option><option value="D">每天 D</option><option value="W">每周 W</option><option value="MS">每月月初 MS</option><option value="ME">每月月末 ME</option><option value="custom">自定义</option></select></div>
          <div class="field hidden" id="custom_freq_field"><label for="custom_freq">自定义采样频率</label><input id="custom_freq" placeholder="例如：2h、10min、3D"></div>
          <div class="field"><label for="start">起始时间</label><input id="start" type="datetime-local" value="2026-07-01T00:00" required></div>
          <div class="field"><label for="seed">随机种子</label><input id="seed" type="number" value="42"></div>
          <div class="field"><label for="anomalies">异常注入</label><select id="anomalies"><option value="auto">由 LLM 决定</option><option value="on">开启</option><option value="off">关闭</option></select></div>
          <div class="field"><label for="severity">异常强度</label><select id="severity"><option value="">自动</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>
          <div class="field full"><label for="reference">参考时间序列 Arrow（可选）</label><div class="picker-row"><input id="reference" placeholder="/path/to/reference.arrow"><button type="button" class="secondary" id="pick_reference">选择 Arrow</button></div><input id="reference_file" class="hidden" type="file" accept=".arrow"></div>
          <div class="field full"><label for="model">模型</label><select id="model">{% for model in available_models %}<option value="{{ model }}" {% if model == default_model %}selected{% endif %}>{{ model }}</option>{% endfor %}</select></div>
        </div><div class="actions"><button class="primary" id="submit" type="submit">开始生成</button></div>
      </form></section>
      <section class="panel"><div class="panel-head">运行状态</div><div class="status" id="status"><p class="empty">尚未开始任务。结果会写入指定文件夹；完成后会显示抽样趋势图和文件列表。</p></div></section>
    </div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id), form=$('form'), statusBox=$('status'), submit=$('submit');let timer,lastJob=null;
function syncMode(){const d=$('dataset').checked;$('filename_field').classList.toggle('hidden',d);$('count_field').classList.toggle('hidden',!d);document.querySelectorAll('.dataset-only').forEach(x=>x.classList.toggle('hidden',!d));$('description').placeholder=d?'例如：气象、工业用电、空气质量、服务器监控、零售销售':'例如：生成中国南方夏季工业园区的电力负载'}
document.querySelectorAll('input[name="mode"]').forEach(el=>el.addEventListener('change',syncMode));syncMode();
$('freq').addEventListener('change',()=>{$('custom_freq_field').classList.toggle('hidden',$('freq').value!=='custom')});
async function pickPath(endpoint,target){try{const r=await fetch(endpoint,{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||'选择失败');if(j.path)$(target).value=j.path}catch(e){statusBox.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
$('pick_output').addEventListener('click',()=>pickPath('/api/select-output-dir','output_dir'));
$('pick_reference').addEventListener('click',()=>$('reference_file').click());
$('reference_file').addEventListener('change',async()=>{const file=$('reference_file').files[0];if(!file)return;const data=new FormData();data.append('file',file);try{const r=await fetch('/api/upload-reference-arrow',{method:'POST',body:data}),j=await r.json();if(!r.ok)throw new Error(j.error||'Arrow 文件选择失败');$('reference').value=j.path;statusBox.innerHTML=`<p class="message">已选择参考 Arrow：${esc(file.name)}</p>`}catch(e){statusBox.innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{$('reference_file').value=''}});
function drawPreview(points){const canvas=$('preview_chart');if(!canvas||!points||points.length<2)return;const box=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(320,Math.floor(box.width*dpr));canvas.height=Math.floor(box.height*dpr);const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,pad=34*dpr;const ys=points.map(p=>Number(p.value)).filter(Number.isFinite),min=Math.min(...ys),max=Math.max(...ys),span=max-min||1;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#d8e1e5';ctx.lineWidth=dpr;ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();ctx.strokeStyle='#146f7f';ctx.lineWidth=2*dpr;ctx.beginPath();points.forEach((p,i)=>{const x=pad+(w-2*pad)*i/(points.length-1),y=h-pad-(Number(p.value)-min)/span*(h-2*pad);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#526169';ctx.font=`${12*dpr}px sans-serif`;ctx.fillText(max.toFixed(2),6*dpr,pad);ctx.fillText(min.toFixed(2),6*dpr,h-pad);}
function renderValue(v){return typeof v==='object'&&v!==null?JSON.stringify(v):String(v??'')}
function render(j){lastJob=j;const labels={queued:'等待中',running:'生成中',completed:'已完成',failed:'失败'};const result={...(j.result||{})},preview=result.preview;delete result.preview;const rows=Object.entries(result).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(renderValue(v))}</dd></div>`).join('');const files=(j.files||[]).map(f=>`<div class="file"><span title="${esc(f.path)}">${esc(f.name)}</span><a href="${f.download_url}">下载</a></div>`).join('');const chart=preview&&preview.points&&preview.points.length?`<div class="chart-wrap"><canvas id="preview_chart"></canvas><p class="chart-note">抽样 ${preview.points.length} 点 / 共 ${preview.count} 点${preview.series_id?'，'+esc(preview.series_id):''}</p></div>`:'';statusBox.innerHTML=`<div class="status-row"><span>${labels[j.status]||j.status}</span><span>${j.progress}%</span></div><div class="track"><div class="bar" style="width:${j.progress}%"></div></div><p class="message">${esc(j.message)}</p>${j.error?`<div class="error">${esc(j.error)}</div>`:''}${chart}${rows?`<dl class="summary">${rows}</dl>`:''}${files?`<div class="files">${files}</div>`:''}`;if(preview&&preview.points)drawPreview(preview.points)}
window.addEventListener('resize',()=>{const preview=lastJob&&lastJob.result&&lastJob.result.preview;if(preview&&preview.points)drawPreview(preview.points)});
async function poll(id){try{const r=await fetch(`/api/jobs/${id}`),j=await r.json();render(j);if(['completed','failed'].includes(j.status)){submit.disabled=false;submit.textContent='开始生成';return}timer=setTimeout(()=>poll(id),1200)}catch(e){statusBox.innerHTML=`<div class="error">状态查询失败：${esc(e.message)}</div>`;submit.disabled=false}}
form.addEventListener('submit',async e=>{e.preventDefault();clearTimeout(timer);submit.disabled=true;submit.textContent='正在启动…';const payload={generation_mode:document.querySelector('input[name="mode"]:checked').value,description:$('description').value,output_dir:$('output_dir').value,filename:$('filename').value,series_count:$('series_count').value,diversity_strength:$('diversity_strength').value,length:$('length').value,freq:$('freq').value,custom_freq:$('custom_freq').value,start:$('start').value,seed:$('seed').value,anomalies:$('anomalies').value,anomaly_severity:$('severity').value,reference:$('reference').value,model:$('model').value};try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw new Error(j.error||'任务启动失败');render(j);submit.textContent='生成中…';poll(j.id)}catch(e){statusBox.innerHTML=`<div class="error">${esc(e.message)}</div>`;submit.disabled=false;submit.textContent='开始生成'}});
</script></body></html>
